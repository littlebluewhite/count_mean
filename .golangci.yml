version: "2"

# 精簡 lint config — 只啟用「可能藏 bug 的」linter，
# 純風格 linter (wsl/lll/goconst/revive 等) 全 disable 直到後續另開排程清理。
# 設計理由：v1→v2 schema 遷移後 baseline 有 657 個 issue，多數是 stylistic noise；
# 此 config 聚焦 ~67 個有 bug 嫌疑的 finding，先解掉再考慮全套 enforcement。

run:
  go: "1.26"
  tests: true

linters:
  default: none
  enable:
    - copyloopvar    # Go 1.22+ loop variable scoping
    - err113         # sentinel error pattern
    - errcheck       # unchecked errors
    - gosec          # security
    - govet          # Go vet checks
    - ineffassign    # ineffective assignments
    - staticcheck    # general best-practices (整合 v1 的 stylecheck + gosimple)
    - wrapcheck      # error wrapping

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    staticcheck:
      # ST1005: error strings should not be capitalized
      #   codebase 以中文為主要 error 訊息（無大小寫概念），且 Excel/Motion/Force Plate
      #   等專有名詞大寫是 deliberate。對此 codebase 全面 disable。
      # ST1000: package comments
      #   專案不採取每個 package 都有 doc.go 的慣例（多數 package 只有少數檔），
      #   且 test-only package (test/integration) 不該被要求 package doc。
      # ST1003: package names should not contain underscores
      #   phase_sync / muscle_ratio 用底線是刻意的（與 directory name 一致），
      #   既有檔已用 //nolint:revive 標註過，這裡一併在 staticcheck disable。
      checks:
        - all
        - -ST1005
        - -ST1000
        - -ST1003
    wrapcheck:
      # ctx.Err() 已是 sentinel (context.Canceled / DeadlineExceeded)，
      # caller 用 errors.Is 仍可比對；wrap 反而模糊語義。
      ignore-sigs:
        - .Err()
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
      # 同 monorepo 內 package 互呼叫不強制 wrap (避免多層 noise wrap)。
      # 只對真正 external (stdlib / 第三方) 強制 wrap。
      ignore-package-globs:
        - count_mean/internal/*
        - count_mean/util

  exclusions:
    rules:
      # 測試檔放寬
      - path: _test\.go
        linters:
          - err113
          - wrapcheck
          - errcheck
          - gosec
      # 測試目錄整體放寬
      - path: test/
        linters:
          - err113
          - wrapcheck
          - errcheck
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
